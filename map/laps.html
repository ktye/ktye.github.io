<script>
let pd=e=>{e.preventDefault();e.stopPropagation()}

let floor=Math.floor,round=Math.round,min=Math.min,max=Math.max
let mx;
cnv.onmousedown=e=>(mx=e.clientX);cnv.onmouseup=e=>{mx=0};cnv.onwheel=e=>zoom(e.deltaY<0)
cnv.onmousemove=e=>{let top=cnv.getBoundingClientRect().top,x=e.clientX,y=e.clientY,a=Math.abs;if(!mx)return pos(x,floor(y-top));if(a(x-mx))pan(x-mx);mx=x}

//parse fit file
let parse=b=>{let i,j,r={time:[],bpm:[],lap:[]},v=new DataView(b),p=0,d0=631065600,e=s=>{throw new Error(p+':'+s)}
 let B=_=>v.getUint8(p++),H=_=>(p+=2,v.getUint16(p-2,1)),U=_=>(p+=4,v.getUint32(p-4,1))
 let nh=B(),ver=B(),profile=H(),sz=U(),ep=nh+sz,defs=[];U()==1414088238||e(".FIT")
 let p18=f=>{f.forEach(x=>x.i==2?(r.start=d0+U()):x.i==5?(r.sport=B()):x.i==8?(r.secs=U()/1000):x.i==9?(r.meters=U()/100):x.i==26?(r.laps=H()):p+=x.s)}//session
 let p19=(f,l)=>{l={};f.forEach(x=>x.i==2?l.start=d0+U():x.i==8?l.secs=U()/1000:x.i==9?l.meters=U()/100:p+=x.s);r.lap.push(l)}//lap
 let p20=f=>{let s=180/2147483648,bp=0;f.forEach(x=>x.i==253?ti=U():x.i==3?bp=B():p+=x.s);  r.time.push(ti+d0);r.bpm.push(bp)}//record
 p=nh;while(p<ep){let h=B(),lt=h&15;
  if(h&64){B();B();let m=H(),nf=B(),f=[],sf=0;for(i=0;i<nf;i++){let fi={i:B(),s:B()};B();sf+=fi.s;f[i]=fi};f.s=sf;defs[lt]=[m,f]}
  else{let d=defs[lt],m=d[0],f=d[1];m==18?p18(f):m==19?p19(f):m==20?p20(f):p+=f.s}};console.log(enc(r));return r}

//encode to string
let enc=f=>{let i,l=f.lap,n=l.length,b=f.bpm,d,r=[n],h=x=>(x=round(x),r.push(x&255,x>>>8)),t0=f.lap[0].start;l.forEach(l=>{h(l.meters);h(l.secs)});
 d=repz(delta3(unfill(b)));r.push(d[0]);d=d.slice(1).map(x=>3+x);while(d.length%8)d.push(0);r.push(...pack(d));return`${datestr(t0).slice(0,10).replaceAll(".","")}:"${new Uint8Array(r).toBase64()}"`}
let unfill=b=>{let y=100;return b.map((x,i)=>(x=x==255?y:x,(y=x),x))}
let delta3=b=>{let r=[b[0]],i,n=b.length,x=b[0];for(i=1;i<n;i++){r[i]=max(-3,min(3,b[i]-x));x+=r[i]};return r}
let undel3=r=>{let b=[r[0]],i,n=r.length;for(i=1;i<n;i++)b[i]=b[i-1]+r[i];return b}
let repz=b=>{let r=[b[0]],i,c=0;for(i=1;i<b.length;i++)r.push(4==(c=(b[i]==0?c+1:0))?(c=0,(r.length-=3),4):b[i]);return r}
let urez=r=>{let b=[],i;for(i=0;i<r.length;i++)r[i]==4?b.push(0,0,0,0):b.push(r[i]);return b}
let pack38=(a,b,c,d,e,f,g,h)=>[(a<<5)|(b<<2)|(c>>1),((c&1)<<7)|(d<<4)|(e<<1)|(f>>2),((f&3)<<6)|(g<<3)|h]
let unpk83=(a,b,c)=>[(a>>5)&7,(a>>2)&7,((a&3)<<1)|((b>>7)&1),(b>>4)&7,(b>>1)&7,((c>>6)&3)|((b&1)<<2),(c>>3)&7,c&7]
let pack=b=>{let r=[],i;for(i=0;i<b.length;i+=8)r.push(...pack38(...b.slice(i,i+8)));return r}
let unpk=r=>{let b=[],i;for(i=0;i<r.length;i+=3)b.push(...unpk83(...r.slice(i,i+3)));return b}
let dec=(s,t0)=>{let b=Uint8Array.fromBase64(s),p=0,u=_=>b[p++],h=_=>(u()|(u()<<8));                     //decode from string
 let t=t0,lap=[],M=0,S=0,n=u(),i;for(i=0;i<n;i++){let m=h(),s=h();M+=m;S+=s;lap[i]={meters:m,secs:s,start:(t+=s)-s}}
 let q=[u()];b=b.slice(p);n=b.length;i=0;for(i=0;i<n;i+=3)q.push(...unpk83(b[i],b[1+i],b[2+i]));n=q.length;i=0;
 b=undel3(urez(q.map((x,i)=>i?x-3:x))).filter((_,i)=>i<=t-t0);t=b.map((_,i)=>i+t0);
 return({sport:0,start:t0,meters:M,secs:S,lap:lap,bpm:b,time:t})}

let run=(d,s)=>{let x=dec(s,new Date(`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`)/1000);show(x)}

let p2=x=>String(x).padStart(2,"0")
let datestr=t=>{let d=new Date(1000*t);return`${d.getFullYear()}.${p2(1+d.getMonth())}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`}
let dur=s=>{let h=floor(s/3600),m;s-=3600*h;m=floor(s/60);s=floor(s-60*m);return h?`${h}h${p2(m)}m${p2(s)}s`:m?`${p2(m)}m${p2(s)}s`:`${s}s`}
let pace=(m,s)=>(s=1000*s/m,`${floor(s/60)}:${p2(floor(s-60*floor(s/60)))}/k`)

let F,show=x=>{let fast=0;x.lap.forEach((l,i)=>{l.fast=l.meters/l.secs>x.meters/x.secs;l.stop=i<x.lap.length-1?x.lap[1+i].start:x.start+floor(x.secs);fast+=+l.fast});
 let fs=0,fm=0,h=`${x.sport-1?"B":"R"}  ${datestr(x.start)}  ${dur(x.secs)} ${(x.meters/1000).toFixed(1)}km (${pace(x.meters,x.secs)})\n${String(x.lap.length).padStart(2,"0")} laps ${fast} fast:\n`;
 h+=x.lap.filter(l=>l.fast).map((l,i)=>{fs+=l.secs;fm+=l.meters;return` ${String(1+i).padStart(3," ")}    ${dur(l.secs)}  ${String(floor(l.meters)).padStart(5," ")}m  (${pace(l.meters,l.secs)})`}).join("\n")
 h+=`\n   +    ${dur(fs)}  ${String(floor(fm)).padStart(5," ")}m  (${pace(fm,fs)})`
 hdr.textContent=h;T0=0;SX=0;F=x;draw()}

let T0,SX,draw=_=>{let x=F,r=cnv.getBoundingClientRect(),w=floor(r.width),h=floor(r.height);cnv.width=w,cnv.height=h;let c=cnv.getContext('2d');c.reset();c.translate(0.5,0.5);
 let n=x.time.length,L=x.lap.length,i,t=x.time,b=x.bpm,X=t=>floor(SX*(t-T0)),Y=b=>300-2*(b-50);
 if(!SX){let sx=1,dx=x.time[x.time.length-1]-x.start;while(dx>w){sx/=2;dx/=2};SX=sx};if(!T0)T0=x.start;
 for(i=0;i<n;i++)c.fillRect(X(t[i]),Y(b[i]),1,1)
 c.lineWidth=2;c.beginPath();x.lap.forEach(l=>{let x=X(l.start);c.strokeStyle=l.fast?'green':'grey';c.beginPath();c.moveTo(x,12);c.lineTo(x,288);c.stroke()});
 c.font="12px monospace";c.textAlign="center"
 let hl=(a,b,y)=>{c.beginPath();c.moveTo(X(a),Y(y)),c.lineTo(X(b),Y(y));c.stroke()}
 let mi=300,ma=0,j=0,l=x.lap[j],mm=_=>{let x=X((l.start+l.stop)/2);c.lineWidth=1;c.strokeStyle="blue";hl(l.start,l.stop,mi);c.strokeStyle="red";if(l.fast)hl(l.start,l.stop,ma);
  c.textBaseline="top";c.fillText(String(mi),x,1+Y(mi));     if(l.fast)c.fillText(`${pace(l.meters,l.secs)}`,x,0)
  c.textBaseline="bottom";if(l.fast){c.fillText(String(ma),x,-1+Y(ma));c.fillText(`${(l.meters).toFixed(0)}m`,x,300)}};
 for(i=0;i<n;i++){let t=x.time[i],b=x.bpm[i];if(t>l.stop){mm();l=x.lap[++j];mi=300;ma=0};mi=Math.min(mi,b);ma=Math.max(ma,b)}}

let pan=dx=>{T0-=floor(dx/SX);draw();}
let zoom=d=>{let w=floor(cnv.width/2),t=floor(T0+w/SX);SX=d?SX*2:SX/2;T0=floor(t-w/SX);draw()}
let pos=(t,b)=>{cur.textContent=SX?`${50+floor((300-b)/2)} bpm`:''}

let loadf=x=>x.files[0].arrayBuffer().then(b=>show(parse(b)))
window.ondragover=e=>pd(e)
window.ondrop=e=>{pd(e);let l=e.dataTransfer.files;for(let i=0;i<l.length;i++){let f=l.item(i);f.arrayBuffer().then(u=>{show(parse(u))})}}
