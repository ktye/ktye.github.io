<html><head><link rel=icon href="../kelas16.png"><title>world</title></head>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100vw,height:100dvh}
</style>
<body onload='f()'>
<canvas id="cnv"></canvas>
<script>
let z=6,X=0,Y=0,mx=0,my=0,u;
let world=_=>{let x=u.map(x=>x>>>16),y=u.map(x=>x&0xffff),n=x.length,i;
 for(i=0;i<n;i++){x[i]=(x[i]-X)>>>z;y[i]=(y[i]-Y)>>>z} 
 resize();let c=cnv.getContext('2d');c.reset()
 let t0=performance.now()
 let w=cnv.width,h=cnv.height,d=c.createImageData(w,h),U=new Uint32Array(d.data.buffer);
 for(i=0;i<n;i++){let xi=x[i],yi=y[i];if(xi>=0&&xi<w&&yi>=0&&yi<h)U[xi+yi*w]=0xff000000;}
 c.putImageData(d,0,0)
}
let zoomat=(x,y,d)=>{let z1=z-d;if(z1<0||z1>10)return;if(d>0){X+=x<<z1;Y+=y<<z1}else{X-=x<<z;Y-=y<<z}z=z1;world()} //X+x<<z = X'+x<<z'   X':new offset, z' after scaling.
let pan=(dx,dy)=>{X-=(dx<<z);Y-=(dy<<z);world()}

cnv.ondblclick=_=>{X=0;Y=0;z=6;world()}
cnv.onmousedown=e=>{mx=e.clientX;my=e.clientY}
cnv.onmouseup=e=>{let x=e.clientX,y=e.clientY,a=Math.abs;if(a(x-mx)+a(y-my)>10)pan(x-mx,y-my);}
cnv.onwheel=e=>zoomat(e.clientX,e.clientY,Math.sign(-e.deltaY))


window.addEventListener('resize',world,{passive:true});
let resize=c=>{const vv=window.visualViewport;cnv.width=Math.floor(vv.width);cnv.height=Math.floor(vv.height)}

let f=x=>fetch("shorts/1783100117.shorts").then(r=>r.arrayBuffer()).then(b=>{u=new Uint32Array(b);world()})

//state pts



</script>
</body>
</html>
