<!doctype html>
<html><head><meta charset=utf-8><title>&gt;</title>
<link rel=icon href="js.png">
<style>
*{/*box-sizing:border-box;overflow:clip;*/font-family:monospace}
html{height:100vh}
body{display:flex;margin:0;overflow:hidden}
#desk{height:100vh;width:100%;background:#ccc;overflow:hidden}
#tty{width:80ch;height:22rem;line-height:1.1rem;background:black;color:#ccc;margin:0;}
#tty:focus-within{color:white}
#rdl{color:white;outline:none}
.win{position:absolute;border:2px solid black;background:white;overflow:hidden}
.hdr{text-align:center;font-weight:bold;border-bottom:2px solid black;padding:5px;background:#eee}
.hdr:hover{cursor:pointer}
.plr{padding-left:10px;float:right}
</style></head><body>
 
<div id="desk">
</div>

<script src="plot.js"></script>
<script>

//desktop
let af=Array.from,ac=(c,x)=>(x.appendChild(c),x)
let pd=e=>(e.preventDefault(),e.stopPropagation()) 
let ce=x=>document.createElement(x)
let cl=(c,x)=>(x.classList.add(c),x)
let cs=getComputedStyle
let bb=x=>x.getBoundingClientRect()
let qs=(x,y)=>x.querySelector(y),qa=(x,y)=>x.querySelectorAll(y)
let win=(x,t)=>{let i=desk.childElementCount
 let w=cl("win",ce("w"));
 w.innerHTML=`<div class="hdr">
  <span style="float:left;position:relative;" class="box"></span>
  <span>${t}</span>
  <span class="plr cxx" title="close">&#x2717;</span>
  <span class="plr c__" title="minimize">_</span>
  <span class="plr cud" title="toggle vertical max">↕</span>
  <span class="plr clr" title="toggle horizontal max">←→</span>
 </div><div></div>`+(x?x:"");
 ac(w,desk);lay(w,i);drag(w);
 if(t!="todo")qs(w,".cxx").style.display="none";
 return w}

let lay=(w,i)=>{let r=bb(desk);w.style.left=(5+r.left+20*i)+"px";w.style.top=(5+r.top+30*i)+"px"}
let drag=w=>{let h=w.firstElementChild,a=0,p=0,c=0,d=0
 let cd=_=>{document.onmouseup=null;document.onmousemove=null}
 let mm=e=>{pd(e);a=c-e.clientX;b=d-e.clientY;c=e.clientX;d=e.clientY;let r=bb(desk),R=bb(w);
  w.style.top=Math.max(0,Math.min(r.height-R.height,w.offsetTop-b))+"px"
  w.style.left=Math.min(r.left+r.width-R.width,Math.max(r.left,w.offsetLeft-a))+"px"}
 let md=e=>{pd(e);w.parentNode.appendChild(w);/*bring to top*/
 let p=e.target.parentElement.parentElement,cl=e.target.className.slice(-3);
 if(cl=="cxx")return close(p  );if(cl=="c__")return hide(p)
 if(cl=="cud")return resiz(p,0);if(cl=="clr")return resiz(p,1)
 if(cl=="box")return restore(w);
 c=e.clientX;d=e.clientY;document.onmouseup=cd;document.onmousemove=mm}
 h.onmousedown=md}
let close=x=>x.remove()
let winsz=w=>[w.clientWidth,w.clientHeight-w.firstChild.clientHeight-2]
let resiz=(x,H)=>{let l=x.dataset.l,t=x.dataset.t,w=x.dataset.w,h=x.dataset.h;
 if(H){ if(l){x.style.left=l;x.style.width=w;x.dataset.l="";x.dataset.w=""}
        else{x.dataset.l=x.style.left;x.dataset.w=cs(x).width;x.style.left="0px";x.style.width=(desk.clientWidth-4)+"px"}}
 else{  if(t){x.style.top=t;x.style.height=h;x.dataset.t="";x.dataset.h=""}
	else{x.dataset.t=x.style.top;x.dataset.h=cs(x).height;x.style.top="0px";x.style.height=(desk.clientHeight-4)+"px"} };reszc(x)}
let setsz=(x,w,h)=>{x.dataset.l="";x.dataset.t="";x.dataset.w="";x.dataset.h="";x.style.width=w+"px";x.style.height=(h+x.firstChild.clientHeight+2)+"px";reszc(x);ondesk(x)}
let ondesk=w=>{let W=window.innerWidth,H=window.innerHeight,r=bb(w);w.style.top=max(0,min(H-r.height,r.top))+"px";w.style.left=max(0,min(W-r.width,r.left))+"px";}
let hide=x=>{ x.dataset.L=x.style.left;x.dataset.T=x.style.top;x.dataset.W=cs(x).width;x.dataset.H=cs(x).height;
 x.style.height=(bb(x.firstChild).height-4)+"px";x.style.width="100px";af(qa(x,".cud,.clr,.c__,.cxx")).map(x=>x.style.display="none");qs(x,".box").textContent="☐"}
let restore=x=>{ x.style.left=x.dataset.L;x.style.top=x.dataset.T;x.style.width=x.dataset.W;x.style.height=x.dataset.H 
 qs(x,".box").textContent="";af(qa(x,".cud,.clr,.c__")).map(x=>x.style.display="");if(0/*todo*/)qs(x,".cxx").style.display="";reszc(x)}
let reszc=x=>{x==con?ttyresz():x==plt?pltresz():0}

//tty
let rlbuf=[],rlpos=0
let rladd=x=>{rlpos=rlbuf.length;if(rlbuf.length&&rlbuf[rlbuf.length]==x)return x;rlbuf.push(x);rlpos++;return x}
let rlprev=x=>{let n=rlbuf.length;  if(rlpos>0)rlpos--;rdl.textContent=(n?rlbuf[rlpos]:"");rlend()}
let rlnext=x=>{let n=rlbuf.length;  if(rlpos<n)rlpos++;rdl.textContent=(n?rlbuf[rlpos]:"");rlend()}
let rlend=_=>{let r=document.createRange(),s=window.getSelection();r.selectNodeContents(rdl);r.collapse(false);s.removeAllRanges();s.addRange(r);rdl.focus()}
let prmt=x=>{prm.textContent=x?"█":"";rdl.hidden=!x;if(x)rdl.focus()}

let exec=x=>{out.textContent+=x+"\n";rdl.textContent="";js(x)}
let con=win(`<pre id="tty"><span id="out"></span><span id="rdl" contenteditable="plaintext-only" spellcheck=false tabindex="0">plot(x,y)</span><span id="prm"></span></pre>`,"js");con.style.left="0px";con.style.top=(bb(desk).height-bb(con).height)+"px";
tty.onclick=_=>rdl.focus();out.textContent=">";prmt(1);tty.l=20;tty.c=80;let pxch=tty.clientWidth/80;
rdl.onkeydown=(e,q)=>(q=e.key,"Enter"==q?(pd(e),exec(rladd(rdl.textContent))):"ArrowUp"==q?(pd(e),rlprev(rdl.textContent)):"ArrowDown"==q?(pd(e),rlnext(rdl.textContent)):("c"==q&&e.ctrlKey)?(pd(e),(out.textContent=""),intr()):"Escape"==q?(pd(e),rdl.textContent=""):"Tab"==q?pd(e):0)
let jp=_=>{let v=out.textContent.split("\n"),p=">";v=(tty.l-1<v.length?v.slice(v.length-tty.l+1):v).map(x=>x.length>tty.c?x.slice(0,tty.c-2)+"..":x).join("\n");
 v+=v.endsWith("\n")?p:"\n"+p;out.textContent=v;rdl.textContent="";prmt(1);}
let ttyresz=_=>{let px=x=>+(x.slice(0,-2)),c=floor(con.clientWidth/pxch),[w,h]=winsz(con),l=floor(h/px(cs(tty).lineHeight));tty.style.width=c+"ch";tty.style.height=(1.1*l)+"rem";tty.c=c;tty.l=l;jp()}
let c17=(x,l)=>{let n=0,i,j;for(i=0;i<x.length;i++)if(x[i]=='\n'){n++;if(n>l-3){x=x.slice(0,j);return x.slice(0,j)+"\n.."};j=i};return x}
let O=x=>out.textContent+=c17(x,tty.l)

//plot
let plt=win(`<svg width="600" height="400"></svg>`,"~");plt.style.top="0px";plt.style.left=(bb(desk).width-bb(plt).width)+"px"
let pltresz=_=>{let[w,h]=winsz(plt),s=qs(plt,"svg");s.setAttribute("width",w);s.setAttribute("height",h)}
plt.oncontextmenu=zoomreset
let P=x=>{let svg=qs(plt,"svg"),w=600,h=400,rs=0,isplt=x=>("object"==typeof x)&&("Type"in x),isz=x=>ismat(x)&&x.z
 if(x.length>2)[rs,w]=[1,x[2]];if(x.length>3)[rs,h]=[1,x[3]];
 if(rs){svg.innerHTML="";setsz(plt,w,h);}
 //if(1=x.length&&isplt(x[0]))
 plot([{Type:"xy",Lines:[{X:x[0],Y:x[1]}]}],0,svg,0,0,0,0)  //plot(p,c,svg,sld,det,txt,cap,...a)
}
const pdoc=`plot..`

//program file
let prg=win(`<input type="file" id="fbut" hidden onchange="loadprg(this)"><label id="flab" for="fbut" style="display:inline-block;padding:5px">open</label>`,">");prg.style.left="0px";prg.style.top="0px"
let loadprg=async x=>{let f=x.files[0];flab.textContent=f.name;jsprg=await f.text();intr()}

let jw,jsprg="",matjs;
let worker=_=>`let $=x=>({t:0,r:x===undefined?"undefined":ismat(x)?smat(x):x.toString()})
 let plot=(...x)=>(postMessage(/*${pdoc}*/{t:1,r:x}),"") //pdoc shows up if you type "plot"
 onmessage=e=>{ try{postMessage($(_=eval(e.data)))}catch(E){console.log(E);postMessage({t:0,r:E.message})}; };
 let JS=JSON.stringify;         //^(_ is the last result in the repl)
 ${matjs}\n${jsprg}             //math/matrix library + user program
 let x=iota(4),y=rand(4)
`
let jstart=_=>{jw=new Worker(URL.createObjectURL(new Blob([worker()],{type:'text/javascript'})));jw.onmessage=x=>{x.data.t?P(x.data.r):O(x.data.r);x.data.t?0:jp()}}
let js=x=>jw.postMessage(x),intr=_=>{jw.terminate();jstart();}
fetch("mat.js").then(r=>r.text()).then(r=>{matjs=r;jstart()})

window.onerror=e=>{console.log(e);O("\n"+e);jp()} //e.g. in user program

//let edt=win("","edit")
//let dir=win("","dir")

</script></body></html>
