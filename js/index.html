let drag=w=>{let h=w.firstElementChild,a=0,p=0,c=0,d=0

let close=x=>x.remove()
let winsz=w=>[w.clientWidth,w.clientHeight-w.firstChild.clientHeight-2]
let resiz=(x,H)=>{let l=x.dataset.l,t=x.dataset.t,w=x.dataset.w,h=x.dataset.h;
 if(H){ if(l){x.style.left=l;x.style.width=w;x.dataset.l="";x.dataset.w=""}

 else{  if(t){x.style.top=t;x.style.height=h;x.dataset.t="";x.dataset.h=""}
	else{x.dataset.t=x.style.top;x.dataset.h=cs(x).height;x.style.top="0px";x.style.height=(desk.clientHeight-4)+"px"} };reszc(x)}
let setsz=(x,w,h)=>{x.dataset.l="";x.dataset.t="";x.dataset.w="";x.dataset.h="";x.style.width=w+"px";x.style.height=(h+x.firstChild.clientHeight+2)+"px";reszc(x);ondesk(x)}
let ondesk=w=>{let W=window.innerWidth,H=window.innerHeight,r=bb(w);w.style.top=max(0,min(H-r.height,r.top))+"px";w.style.left=max(0,min(W-r.width,r.left))+"px";}
let hide=x=>{ x.dataset.L=x.style.left;x.dataset.T=x.style.top;x.dataset.W=cs(x).width;x.dataset.H=cs(x).height;
 x.style.height=(bb(x.firstChild).height-4)+"px";x.style.width="100px";af(qa(x,".cud,.clr,.c__,.cxx")).map(x=>x.style.display="none");qs(x,".box").textContent="☐"}
let restore=x=>{ x.style.left=x.dataset.L;x.style.top=x.dataset.T;x.style.width=x.dataset.W;x.style.height=x.dataset.H

let reszc=x=>{x==con?ttyresz():x==plt?pltresz():(x.dataset.win in T)?table(x.dataset.win):0}

//tty
let rlbuf=[],rlpos=0

let rlprev=x=>{let n=rlbuf.length;  if(rlpos>0)rlpos--;rdl.textContent=(n?rlbuf[rlpos]:"");rlend()}
let rlnext=x=>{let n=rlbuf.length;  if(rlpos<n)rlpos++;rdl.textContent=(n?rlbuf[rlpos]:"");rlend()}
let rlend=_=>{let r=document.createRange(),s=window.getSelection();r.selectNodeContents(rdl);r.collapse(false);s.removeAllRanges();s.addRange(r);rdl.focus()}
let prmt=x=>{prm.textContent=x?"█":"";rdl.hidden=!x;if(x)rdl.focus()}

let exec=x=>{out.textContent+=x+"\n";rdl.textContent="";js(x)}

tty.onclick=_=>rdl.focus();out.textContent=">";prmt(1);tty.l=20;tty.c=80;let pxch=tty.clientWidth/80;
rdl.onkeydown=(e,q)=>(q=e.key,"Enter"==q?(pd(e),exec(rladd(rdl.textContent))):"ArrowUp"==q?(pd(e),rlprev(rdl.textContent)):"ArrowDown"==q?(pd(e),rlnext(rdl.textContent)):("c"==q&&e.ctrlKey)?(pd(e),intr()):"Escape"==q?(pd(e),rdl.textContent=""):"Tab"==q?pd(e):0)
let jp=_=>{let v=out.textContent.split("\n"),p=">";v=(tty.l-1<v.length?v.slice(v.length-tty.l+1):v).map(x=>x.length>tty.c?x.slice(0,tty.c-2)+"..":x).join("\n");
 v+=v.endsWith("\n")?p:"\n"+p;out.textContent=v;rdl.textContent="";prmt(1);}
let ttyresz=_=>{let px=x=>+(x.slice(0,-2)),c=floor(con.clientWidth/pxch),[w,h]=winsz(con),l=floor(h/px(cs(tty).lineHeight));tty.style.width=c+"ch";tty.style.height=(1.1*l)+"rem";tty.c=c;tty.l=l;jp()}
let c17=(x,l)=>{let n=0,i,j;for(i=0;i<x.length;i++)if(x[i]=='\n'){n++;if(n>l-3){x=x.slice(0,j);return x.slice(0,j)+"\n.."};j=i};return x}
let O=x=>out.textContent+=c17(x,tty.l)

//table windows
let page=(t,i0,M,dir)=>{let id=t.dataset.table;let i=[0,max(0,i0-10),min(M-10,i0+10),M-10][dir];t.dataset.filter=`i>${i-1}`;table(id)}
let T={},fs={file:[],dir:[],size:[],date:[]},tlen=d=>"object"!=typeof d?err("not a table"):keys(d).length==0?0:((d=vals(d)[0]),(d.m?d.m:d.length));
let filter=(d,s)=>{let r=[],k=keys(d),f=new Function(...k,"i","return "+s),n=tlen(d),i;for(i=0;i<n;i++)if(f(...k.map(x=>ismat(d[x])&&d[x].z?d[x][2*i]:d[x][i]),i))r.push(i);return r}
let table=(id,d)=>{console.log("id",id,"d",d);let w=findwin(id);if(!w)w=win(`<table data-table="${id}" data-filter="i>-1"></table>`,id);if(!d)d=T[id]; let k=keys(d),v=vals(d),t=qs(w,"table"),i0=+t.dataset.i0,n=k.length,M=tlen(d),i,r,c,ta=`<tr><th>i</th>`+k.map(x=>`<th>${x}</th>`).join("")+"</tr>";T[id]=d;
 let I=t.dataset.filter?filter(d,t.dataset.filter):iota(M),m=min(w.dataset.t?200:11,I.length);let pg=x=>`onclick='page(this.closest("table"),${I[0]},${M},${x})'`
 ta+=`<tr><td colspan="${1+n}"><input style='width:100%;box-sizing:border-box;field-sizing:content;padding:0;border:1px solid;outline:none' onchange='this.closest("table").dataset.filter=this.value;table("${id}")' title='filter, e.g. i>10' value="${t.dataset.filter}"></td></tr>`
 for(i=0;i<m;i++){let Ii=I[i];r="<tr>";if(m<I.length&&i==m-1){r+=`<td colspan="${n}">.. ${I.length}/${M} rows <span class='pag' ${pg(0)}>&laquo;</span><span class='pag' ${pg(1)}>&lt;</span><span class='pag' ${pg(2)}>&gt;</span><span class='pag' ${pg(3)}>&raquo;</span><div></td>`}else{;for(j=-1;j<n;j++){c=v[j],r+=`<td>${j<0?String(Ii):ismat(c)&&c.z?sz(c[2*Ii],c[2*Ii+1]):String(c[Ii])}</td>`}};ta+=r+"</tr>";}
 t.innerHTML=ta;return w} //dataset.id

let fta=table("files",fs);
fta.style.left="0px"

//program file / data files (drop one .js file use as program, otherwise(non/js or multiple) use as data files.
window.ondragover=e=>pd(e);window.ondrop=e=>{pd(e);let f,l=e.dataTransfer.files;1==l.length&&l.item(0).name.endsWith(".js")?loadprg(l.item(0)):loaddat(l)}

             <input type="file" id="dbut" hidden onchange="dload(this)"  multiple webkitdirectory><label id="dlab" for="dbut" class="but">open data files</label><span title="unload files" class="but" onclick="unload()"> &#x2717; </span>`,"load");prg.style.left="0px";prg.style.top="0px"
let pload=x=>loadprg(x.files[0]),dload=x=>{dlab.textContent=`[${x.files.length} files]`;console.log(x.files)}

let loaddat=f=>{if(1==f.length&&0==f[0].size)err("ignore empty file(directory?)\nuse 'open data files' to load directories..");af(f).forEach(x=>{fs.file.push(x.name);fs.dir.push(x.webkitRelativePath);fs.size.push(x.size);fs.date.push(new Date(x.lastModified).toISOString().replaceAll("-",".").slice(0,19))});table("files",fs);jw.postMessage({t:1,name:"fs",r:fs})}
let unload=__=>{keys(fs).forEach(x=>fs[x]=[])}

{
 let d={name:[],abc:[],def:[]};for(let i=0;i<100;i++){d.name.push("xyz");d.abc.push(i);d.def.push(1000+0.01*i)};table("data",d);

let plt

let plt=win(`<svg width="600" height="400"></svg>`,"~");plt.style.top="0px";plt.style.left=(bb(desk).width-bb(plt).width)+"px"
let pltresz=_=>{let[w,h]=winsz(plt),s=qs(plt,"svg");s.setAttribute("width",w);s.setAttribute("height",h)}

let P=x=>{let svg=qs(plt,"svg"),w=600,h=400,rs=0,isplt=x=>("object"==typeof x)&&("Type"in x),isz=x=>ismat(x)&&x.z

}
*/

let worker=_=>`let $=x=>({t:0,r:x===undefined?"undefined":ismat(x)?smat(x):x.toString()})
 let tt={name:[1,2,3],yy:[4,5,6]}
 let plot=(...x)=>(postMessage(/*${pdoc}*/{t:1,r:x}),"")        //pdoc shows up if you type "plot"

 onmessage=e=>{ try{e.data.t?globalThis[e.data.name]=e.data.r:postMessage($(_=eval(e.data.r)))}catch(E){console.log(E);postMessage({t:0,r:E.message})}; };         //_ is the last result in the repl
 let JS=JSON.stringify,su=x=>t_.decode(x),t_=new TextDecoder("utf-8"),us=x=>_t.encode(x),_t=new TextEncoder("utf-8")

`
