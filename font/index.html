text:<br>
<textarea id="txt" onchange="paint()"></textarea>
<p>output image:<br>
<canvas id="out"></canvas>
<script>
abc.value=`ABCDEFGHIJKLMNOPQRSTUVWXYZ 12345
abcdefghijklmnopqrstuvwxyz 67890
{}[]()<>$*-+=/#_%^@\\&|~?'" !,.;:`

/*
abc.value=`:+-*%&|<>=!~,^#_$?@.0123456789'/\\;'"(){}[]
abcdefghijklmnopqrstuvwxyz
ABCDEFGHIJKLMNOPQRSTUVWXYZ`

abc.value=` !"#$%&'()*+,-./
0123456789:;<=>?
@ABCDEFGHIJKLMNO
PQRSTUVWXYZ[\\]^_
\`abcdefghijklmno
pqrstuvwxyz{|}~`
*/
txt.value=`#include<stdio.h>
#define U getchar()
#define H (U|U<<8)
#define F (double)(H|H<<16)/11930465
int main(){int d[32],t,z,n=U;
while(--n)U;while(0<=(n=U)){t=n&15;
if(n&64){H;z=20==(n=H)?t:z;d[t]=0;
n=U;while(n--){U;d[t]+=U;U;}}
else{n=d[t];if(t==z){F;
printf("%g %g\\n",F,F);n-=12;}
while(n--)U;}}}`
let loadfont=x=>fn.src=URL.createObjectURL(x.files[0])
let mxy=e=>xy.textContent=`${e.offsetX} ${e.offsetY}`
let F
let paint=_=>{let w,h,u,i,j,k;fnc.width=w=fn.naturalWidth;fnc.height=h=fn.naturalHeight;let c=fnc.getContext('2d');c.drawImage(fn,0,0);
 let d=c.getImageData(0,0,w,h),px=new Uint32Array(d.data.buffer).map(x=>x&0x00ffffff?1:0),x0=+X0.value,y0=+Y0.value,dx=+DX.value,dy=+DY.value,cw=+CW.value,ch=+CH.value;
 let O=Array(127).fill(0),ab=abc.value.split("\n").map(x=>x.split("").map(x=>x.charCodeAt(0)));
 let I=Array(cw*ch).fill(0);k=0;for(j=0;j<ch;j++)for(i=0;i<cw;i++)I[k++]=i+j*w;
 ab.forEach((a,y)=>a.forEach((c,x)=>O[c]=x0+x*dx+w*(y0+y*dy)));console.log("O97",O[97]);F=O.map((o,i)=>O[i]=I.map(x=>px[x+o]));

 grid.width=w;grid.height=h;c=grid.getContext('2d');u=new Uint32Array(d.data.buffer);
 let box=(x,y,z)=>{let o=x0+x*dx+(y0+y*dy)*w;for(let j=0;j<ch;j++)for(let i=0;i<cw;i++)z?u[o+i+j*w]^=0x000000f0:u[o+i+j*w]^=0x00f00f00}
 ab.forEach((a,j)=>a.forEach((c,i)=>box(i,j,1&(i^j))));
 c.putImageData(d,0,0);
 
 let t=txt.value,l=t.split("\n"),n=l.length,m=Math.max(...l.map(x=>x.length)),W=cw*m,H=ch*n;out.width=W;out.height=H;c=out.getContext('2d');d=c.createImageData(W,H);
 console.log("WH",W,H);
 u=new Uint32Array(d.data.buffer);
 let draw=(c,x,y)=>{let o=x*cw+W*ch*y,m=F[c.charCodeAt(0)];k=0;for(let j=0;j<ch;j++)for(let i=0;i<cw;i++)u[o+i+j*W]=m[k++]?0xffffffff:0xff000000}
 l.forEach((r,y)=>r.split("").forEach((c,x)=>draw(c,x,y)));
 c.putImageData(d,0,0);
}
fn.onload=paint;
Array.from(tab.querySelectorAll("input")).forEach(x=>x.onchange=paint);
</script>
