let loadfont=x=>fn.src=URL.createObjectURL(x.files[0])

let F
let paint=_=>{let w,h,i,j,k;fnc.width=w=fn.naturalWidth;fnc.height=h=fn.naturalHeight;let c=fnc.getContext('2d');c.drawImage(fn,0,0);
 let d=c.getImageData(0,0,w,h).data,px=new Uint32Array(d.buffer).map(x=>x&0x00ffffff?1:0),x0=+X0.value,y0=+Y0.value,dx=+DX.value,dy=+DY.value,cw=+CW.value,ch=+CH.value;
 let O=Array(127).fill(0),ab=abc.value.split("\n").map(x=>x.split("").map(x=>x.charCodeAt(0)));
 let I=Array(cw*ch).fill(0);k=0;for(j=0;j<ch;j++)for(i=0;i<cw;i++)I[k++]=j+i*w;
 ab.forEach((a,i)=>a.forEach((c,j)=>O[c]=x0+j*dx+w*(y0+i*dy)));console.log("O97",O[97]);F=O.map((o,i)=>O[i]=I.map(x=>px[x+o]));
 
 let t=txt.value,l=t.split("\n"),n=l.length,m=Math.max(...l.map(x=>x.length)),W=cw*m,H=ch*n;out.width=W;out.height=H;c=out.getContext('2d');d=c.createImageData(W,H);
 console.log("WH",W,H);
 let u=new Uint32Array(d.data.buffer);
 let draw=(c,i,j)=>{let o=j*cw+W*ch*i,m=F[c.charCodeAt(0)];console.log("cijo",c,c.charCodeAt(0),i,j,o);k=0;for(j=0;j<ch;j++)for(i=0;i<cw;i++)u[o+j+i*W]=m[k++]?0xffffffff:0xff000000}
 l.forEach((r,i)=>r.split("").forEach((c,j)=>draw(c,i,j)));
 c.putImageData(d,0,0);
}
fn.onload=paint;
Array.from(tab.querySelectorAll("input")).forEach(x=>x.onchange=paint);
