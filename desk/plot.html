<!doctype html>
<html><head><meta charset=utf-8><title>plot</title>
<style>
canvas{display:inline-block}
.rsz{resize:both;display:block;overflow:hidden}
</style></head><body>

<!-- -->
<div class="rsz" style="width:500px;height:400px"><canvas id="cnv1" width="500" height="400"></canvas></div>
<canvas id="cnv2" width="500" height="400"></canvas>
<canvas id="cnv3" width="800" height="400"></canvas>
<canvas id="cnv4" width="800" height="400"></canvas>

<script src="cnvplot.js"></script>
<script>
let pi=Math.PI,pi_=pi/180,_pi=180/pi,cos=Math.cos,sin=Math.sin,max=Math.max,min=Math.min
let iota=n=>Array(n).fill(0).map((_,i)=>i)
let spiral=n=>{let c=[];for(let i=0;i<n;i++){let p=(i*20/n)%(2*pi),r=i*3*n/(n-1);c.push(r*cos(p),r*sin(p))};return c}
let sine=n=>{let r=Array(n),i,f1=0.01,f2=0.005;for(i=0;i<n;i++)r[i]=2+sin(f1*i)+0.5*sin(f2*i)+0.3*Math.random();return r}
let envelope=(n,x)=>{let Ma=[],Mi=[],m=x.length/n,i,mi,ma,j=0,xi;
 for(i=0;i<x.length;i++){xi=x[i];if(!j){mi=xi;ma=xi};mi=min(mi,xi);ma=max(ma,xi);if(++j==m){j=0;Ma.push(ma);Mi.push(mi)}};
 return[...Ma,...Mi.toReversed()]}
let xenv=x=>{let r=[],i;for(i=0;i<x.length;i+=2)r.push(x[i],x[i]);return r}

let p1=[{Type:"xy",Title:"title",Xlabel:"x-label",Ylabel:"Ylabel",Lines:[{X:[1,2,3],Y:[0,1,0.5]}]}]
let p2=[{Type:"xy",Limits:{Ymin:-5,Ymax:5},Lines:[{X:[-1,0,1,2,3,4,5],Y:[10,-10,1,0,1,-10,10]}]}]
let p3=[{Type:"ampang",Lines:[{X:[1,2,3,4],C:[1,0,2,1,3,4,4,-1]},{X:iota(80).map(x=>x/10),C:spiral(80)}]},
        {Type:"polar",Title:"polar-title-Q",Yunit:"mm/s",Lines:[{X:[1,2,3,4],C:[1,0,2,1,3,4,4,-1]}]}]
let p4=[{Type:"xy",Title:"envelope",Lines:[{X:xenv(iota(1024)),C:envelope(1024,sine(8192))}]}]


cnvplot(cnv1,p1,"resize")
cnvplot(cnv2,p2)
cnvplot(cnv3,p3)
cnvplot(cnv4,p4)

</script></body></html>
