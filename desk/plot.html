<!doctype html>
<html><head><meta charset=utf-8><title>plot</title>
<style>
body{background:#ddd}
h1{font-family:monospace;font-size:medium}
canvas{display:inline-block}
.rsz{resize:both;display:block;overflow:hidden}
</style></head><body>



<script src="cnvplot.js"></script>
<script>
let ncnv=0,c=(w,h)=>{w=w||800;h=h||400;let r=ce("canvas");r.id="cnv"+(ncnv++);r.setAttribute("width",w);r.setAttribute("height",h);document.body.appendChild(r);return r}
let h1=t=>{let h=ce("h1");h.textContent=t;document.body.appendChild(h)}
let ce=x=>document.createElement(x)
let pi=Math.PI,pi_=pi/180,_pi=180/pi,cos=Math.cos,sin=Math.sin,max=Math.max,min=Math.min
let iota=n=>Array(n).fill(0).map((_,i)=>i)
let spiral=n=>{let c=[];for(let i=0;i<n;i++){let p=(i*20/n)%(2*pi),r=i*3*n/(n-1);c.push(r*cos(p),r*sin(p))};return c}
let sine=n=>{let r=Array(n),i,f1=0.01,f2=0.005;for(i=0;i<n;i++)r[i]=2+sin(f1*i)+0.5*sin(f2*i)+0.3*Math.random();return r}
let envelope=(n,x)=>{let r=[],m=x.length/n,i,mi,ma,j=0,xi;
 for(i=0;i<x.length;i++){xi=x[i];if(!j){mi=xi;ma=xi};mi=min(mi,xi);ma=max(ma,xi);if(++j==m){j=0;r.push(mi,ma)}}return r}
let odd=x=>{r=[];for(let i=1;i<x.length;i+=2)r.push(x[i]);return r}
let even=x=>{r=[];for(let i=0;i<x.length;i+=2)r.push(x[i]);return r}

let p1=[{Type:"xy",Title:"title",Xlabel:"x-label",Ylabel:"Ylabel",Lines:[{X:[1,2,3],Y:[0,1,0.5]}]}]
let p2=[{Type:"xy",Limits:{Ymin:-5,Ymax:5},Lines:[{X:[-1,0,1,2,3,4,5],Y:[10,-10,1,0,1,-10,10]}]}]
let p3=[{Type:"ampang",Title:"ampang",Lines:[{X:[1,2,3,4],C:[1,0,2,1,3,4,4,-1]},{X:iota(80).map(x=>x/10),C:spiral(80)}]},
        {Type:"polar",Title:"polar-title-Q",Yunit:"mm/s",Lines:[{X:[1,2,3,4],C:[1,0,2,1,3,4,4,-1]}]},
	{Type:"xy",Title:"xyplot",Limits:{Xmin:10,Xmax:80},Lines:[{X:iota(100),Y:iota(100).map(x=>Math.random())},{X:iota(100),Y:iota(100).map(x=>2+Math.random())}]}]
let E=envelope(1024,sine(8192));
let p4=[{Type:"xy",Title:"minmax",Lines:[{X:iota(1024),Y:even(E)},{X:iota(1024),Y:odd(E)}]}]
let p5=[{Type:"xy",Limits:{Xmin:200,Xmax:500,Ymin:-4,Ymax:6},Title:"envelope",Lines:[{X:iota(1024),C:E}]}]
let p6=[{Type:"xy",Title:"no dx",Lines:[{X:[3.5,3.5,3.5],Y:[1,2,3]}]},
        {Type:"xy",Title:"x=0",Lines:[{X:[0,0,0],Y:[1,2,3]}]},
        {Type:"xy",Title:"no dy",Lines:[{X:[1,2,3],Y:[4,4,4]}]},
        {Type:"xy",Title:"y=0",Lines:[{X:[1,2,3],Y:[0,0,0]}]},
	{Type:"polar",Title:"r=0",Lines:[{C:[0,0,0,0]}]}]

//cnvplot(c(),p1,"resize")
//cnvplot(c(),p2)
//cnvplot(c(),p3)
//cnvplot(c(),p4)
cnvplot(c(),p5)
h1("collapsing limits");cnvplot(c(),p6,"cols",3)

</script></body></html>
